# Le cache de ffmpeg : les paquets d’Ubuntu de ffmpeg, téléchargés une fois depuis main et gardés dans le cache de
# GitHub (actions/cache), pour que « Vérifications » les reprenne sans passer par le miroir d’Ubuntu, parfois si lent
# qu’il menait l’installation jusqu’aux 30 minutes. Un cache écrit depuis main est lisible par toutes les branches et
# toutes les demandes de fusion ; un cache écrit depuis une branche ne l’est que par elle : d’où ce passage sur main.
# GitHub efface un cache que personne ne lit pendant 7 jours : le passage du lundi le garde (ou le refait).
# Rien n’est installé ni publié : les paquets sont seulement téléchargés. Aucun secret, aucun droit d’écrire.
name: Cache de ffmpeg

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remplir:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Le dossier et la clé sont ceux de « Vérifications ». Quand ubuntu-latest change de version d’Ubuntu, changer le
      # numéro de la clé aux deux endroits : les anciens paquets ne serviraient plus.
      - name: Garder les paquets de ffmpeg
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/paquets-ffmpeg
          key: paquets-ffmpeg-ubuntu-1

      # Seulement quand le cache est vide : télécharger, sans rien installer, puis rendre les paquets lisibles à
      # l’enregistrement du cache (apt les écrit en root). Le dossier « partial » et le verrou d’apt ne sont pas gardés.
      - name: Télécharger les paquets de ffmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/paquets-ffmpeg/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --download-only -o Dir::Cache::Archives="$HOME/paquets-ffmpeg" ffmpeg
          sudo rm -rf ~/paquets-ffmpeg/partial ~/paquets-ffmpeg/lock
          sudo chown -R "$USER" ~/paquets-ffmpeg
