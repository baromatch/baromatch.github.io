# Les pages « Où regarder le match » : la semaine (matchs/), une page par match, les villes (regarder-le-match/), une
# page et un badge par vrai bar (bar/), et le plan du site. Le générateur (generateur/construire.mjs, Node seul, sans
# rien à installer) les écrit d’après les listes publiques de l’appli ; cette Action le lance toutes les 3 heures, à la
# main (onglet Actions, « Run workflow »), et à chaque envoi sur main qui touche au générateur, à marque.json ou à
# l’accueil (dont les pages reprennent l’en-tête et le pied de page).
# Si les données ne répondent pas, répondent une erreur ou ne donnent aucun match, le générateur s’arrête sans rien
# écrire : les pages en ligne restent comme elles sont. Il refuse aussi de supprimer d’un coup plus de la moitié des
# pages ; si c’est voulu (après une longue pause, par exemple), relance-la à la main en cochant la case.
# Seuls matchs/, regarder-le-match/, bar/ et sitemap.xml sont enregistrés, avec un message clair, puis envoyés sur
# main. Un envoi fait par le jeton de l’Action ne lance pas la publication de GitHub Pages : l’Action la demande
# elle-même (d’où « pages: write »), puis prévient IndexNow des adresses indexables qui ont changé.
# GitHub met en pause les Actions planifiées d’un dépôt public après 60 jours sans activité : ses propres envois
# comptent comme activité, mais si rien ne change pendant 60 jours, relance-la à la main.
name: Pages des matchs

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      accepter_les_suppressions:
        description: 'Accepter qu’un passage supprime plus de la moitié des pages'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'generateur/**'
      - 'marque.json'
      - 'index.html'
      - 'presse.html'
      - '.github/workflows/pages-des-matchs.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: pages-des-matchs
  cancel-in-progress: false

jobs:
  generer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACCEPTER: ${{ inputs.accepter_les_suppressions }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Construire et contrôler les pages
        run: |
          option=""
          if [ "$ACCEPTER" = "true" ]; then option="--accepter-les-suppressions"; fi
          node generateur/construire.mjs --source=api --changees="$RUNNER_TEMP/changees.txt" $option

      - name: Enregistrer et envoyer les pages qui ont changé
        id: envoi
        run: |
          set -eu
          option=""
          if [ "$ACCEPTER" = "true" ]; then option="--accepter-les-suppressions"; fi
          git config user.name "Pages des matchs"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Seulement les chemins du générateur, même si un autre fichier avait changé.
          enregistrer() {
            for chemin in matchs regarder-le-match bar sitemap.xml; do
              if [ -e "$chemin" ] || [ -n "$(git ls-files -- "$chemin")" ]; then git add -A -- "$chemin"; fi
            done
            if git diff --cached --quiet; then return 1; fi
            if git diff --cached --name-only | grep -vqE '^(matchs|regarder-le-match|bar)/|^sitemap\.xml$'; then
              echo "::error::Un fichier hors de la liste blanche du générateur allait être enregistré."
              exit 1
            fi
            git commit -q -m "Pages des matchs : mise à jour du $(TZ=Europe/Paris date '+%d/%m/%Y à %H:%M')"
          }
          if ! enregistrer; then
            echo "Rien n’a changé : aucune page à enregistrer."
            echo "envoye=non" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for essai in 1 2 3; do
            if git push -q origin HEAD:main; then
              echo "envoye=oui" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "main a changé pendant le passage (essai $essai) : on repart de sa dernière version."
            if ! git pull -q --rebase origin main; then
              # Les deux ont touché les mêmes lignes (le plan du site) : on refait les pages sur la nouvelle version.
              git rebase --abort || true
              git fetch -q origin main
              git reset -q --hard FETCH_HEAD
              node generateur/construire.mjs --source=api --changees="$RUNNER_TEMP/changees.txt" $option
              if ! enregistrer; then
                echo "envoye=non" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          done
          echo "::error::Trois essais d’envoi sur main ont échoué."
          exit 1

      - name: Demander la publication à GitHub Pages
        if: steps.envoi.outputs.envoye == 'oui'
        env:
          DEPOT: ${{ github.repository }}
          JETON_GITHUB: ${{ github.token }}
        run: node generateur/publier.mjs pages

      - name: Prévenir IndexNow des adresses qui ont changé
        if: steps.envoi.outputs.envoye == 'oui'
        continue-on-error: true
        run: node generateur/publier.mjs indexnow "$RUNNER_TEMP/changees.txt"
